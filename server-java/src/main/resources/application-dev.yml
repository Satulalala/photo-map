server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:photomap
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: photo-map-dev-secret-change-before-production-please-use-env
  expiration-ms: 86400000
