server:
  port: 8080

spring:
  application:
    name: photo-map-sync-server
  datasource:
    url: jdbc:h2:mem:photomap
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: photo-map-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info
