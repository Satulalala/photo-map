<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>重置 PhotoMap 密码</title>
  </head>
  <body style="margin:0;background:#f3f4f6;font-family:Arial,'Microsoft YaHei',sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 12px;background:#f3f4f6;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:12px;">
            <tr>
              <td style="padding:32px;">
                <h1 style="margin:0 0 20px;font-size:22px;line-height:1.4;">重置 PhotoMap 密码</h1>
                <p style="margin:0 0 16px;font-size:15px;line-height:1.7;">我们收到了重置 PhotoMap 账号密码的请求。点击下面的按钮设置新密码：</p>
                <p style="margin:24px 0;text-align:center;">
                  <a href="https://photomap.satula.top/#reset_password={{resetToken}}" style="display:inline-block;padding:12px 24px;border-radius:8px;background:#2563eb;color:#ffffff;text-decoration:none;font-size:15px;">设置新密码</a>
                </p>
                <p style="margin:0 0 12px;font-size:14px;line-height:1.7;">此链接将在 30 分钟后失效。若按钮无法打开，请复制以下地址到浏览器：</p>
                <p style="margin:0 0 20px;overflow-wrap:anywhere;font-size:13px;line-height:1.6;"><a href="https://photomap.satula.top/#reset_password={{resetToken}}" style="color:#2563eb;">https://photomap.satula.top/#reset_password={{resetToken}}</a></p>
                <p style="margin:0;color:#6b7280;font-size:13px;line-height:1.7;">如果这不是你本人发起的操作，请忽略此邮件；你的密码不会因此改变。</p>
                <p style="margin:24px 0 0;color:#6b7280;font-size:13px;">PhotoMap</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
